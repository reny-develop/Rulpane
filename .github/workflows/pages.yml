name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet publish src/Rulpane.Viewer -c Release -o publish

      # The Registry's rule sets, copied from nuget.org to beside the viewer, for r=<id>@<version>
      # and for any rules whose uses name them: the page can fetch nothing but its own origin.
      # Run on every deploy, so a version the Registry withholds stops opening at the next one.
      - name: Mirror the Registry's rule sets
        run: dotnet run --project tool/Mirror -c Release -- publish/wwwroot/registry

      # A project site is served under /<repository>/, and the viewer resolves everything —
      # its framework files and the bundled rule sets — against <base>.
      - name: Point base at the repository path
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${base}\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
