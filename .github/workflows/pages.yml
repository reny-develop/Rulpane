name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # With every tag, for the versions kept at their own path below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The guide an AI reads to write a link: every operation it lists is one this runtime runs,
      # every example opens, and llms.txt and index.html are what doc/guide.md says.
      - name: Hold the guide to the runtime
        run: dotnet run --project tool/Guide -c Release -- --check

      - run: dotnet publish src/Rulpane.Viewer -c Release -o publish

      # The Registry's rule sets, copied from nuget.org to beside the viewer, for r=<id>@<version>
      # and for any rules whose uses name them: the page can fetch nothing but its own origin.
      # Run on every deploy, so a version the Registry withholds stops opening at the next one.
      - name: Mirror the Registry's rule sets
        run: dotnet run --project tool/Mirror -c Release -- publish/wwwroot/registry

      # The Gallery's releases, for a view, a theme or a paneset named <owner>/<name>@<version>.
      # The Gallery keeps its own copy of each in git, so this reads a checkout of it.
      - uses: actions/checkout@v4
        with:
          repository: reny-develop/Rulpane.Gallery
          path: gallery

      - name: Mirror the Gallery
        run: dotnet run --project tool/Mirror -c Release -- --gallery publish/wwwroot/gallery gallery

      # A project site is served under /<repository>/, and the viewer resolves everything —
      # its framework files and the bundled rule sets — against <base>.
      - name: Point base at the repository path
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${base}\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll

      # A link made before a breaking change to what a link holds keeps opening at /<repository>/v<n>/:
      # the commit before that change is tagged site/v<n>, and every deploy builds each such tag
      # again, with the mirrors taken again, so a version withheld since stops opening there too.
      - name: Build the versions kept at their own path
        run: |
          base="/${GITHUB_REPOSITORY#*/}"
          for tag in $(git tag --list 'site/v*'); do
            n="${tag#site/}"
            git worktree add "work/$n" "$tag"
            dotnet publish "work/$n/src/Rulpane.Viewer" -c Release -o "work/$n-publish"
            dotnet run --project "work/$n/tool/Mirror" -c Release -- "work/$n-publish/wwwroot/registry"
            dotnet run --project "work/$n/tool/Mirror" -c Release -- --gallery "work/$n-publish/wwwroot/gallery" gallery
            sed -i "s|<base href=\"/\" />|<base href=\"${base}/${n}/\" />|" "work/$n-publish/wwwroot/index.html"
            mv "work/$n-publish/wwwroot" "publish/wwwroot/$n"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
